# Flux source: the cloud-agnostic srdp-chart, published as OCI to the hub
# Scaleway Container Registry.
#
# Unlike Azure (provider: azure + kubelet managed identity), Scaleway registries
# authenticate with static credentials. Flux reads them from the `srdp-registry`
# secret, which External Secrets syncs from Secret Manager (registry-access-key /
# registry-secret-key). See platform/clusters/<env>/externalsecret-registry.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: srdp-registry
  namespace: srdp
spec:
  type: oci
  # rg.<region>.scw.cloud/<namespace>/helm — patched per env if region differs.
  url: oci://rg.nl-ams.scw.cloud/REPLACE-PREFIX-srdp/helm
  secretRef:
    name: srdp-registry
  interval: 10m
