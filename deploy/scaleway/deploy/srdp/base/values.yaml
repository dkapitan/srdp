# Shared Scaleway deltas — identical across dev/stage/prod.
# Per-env values (domain, DB host, bucket, image tags, PN id) -> values/<env>.yaml.
# These override the cloud-agnostic chart defaults; nothing here is env-specific.

# In-cluster Postgres OFF — we use managed Scaleway RDB (per env).
zitadel-db:
  enabled: false

# Traefik as an INTERNAL Scaleway LoadBalancer (attached to the env's Private
# Network, no public IP). Reached only via the Headscale mesh — no public
# ingress. The PN id is per env -> set scw-loadbalancer-pn-ids in values/<env>.yaml.
traefik:
  service:
    annotations:
      service.beta.kubernetes.io/scw-loadbalancer-private: "true"
      service.beta.kubernetes.io/scw-loadbalancer-use-hostname: "true"
    spec:
      type: LoadBalancer

# All envs pull images from the SINGLE hub Container Registry (shared registry
# decision). Only the TAG differs per env (image promotion) -> values/<env>.yaml.
dagster:
  postgresql:
    enabled: false # host/creds per env
  dagster-user-deployments:
    deployments:
      - name: srdp-etl
        image:
          repository: rg.nl-ams.scw.cloud/REPLACE-PREFIX-srdp/srdp-etl
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs: ["-m", "definitions"]
        port: 3030

marimo:
  image:
    repository: rg.nl-ams.scw.cloud/REPLACE-PREFIX-srdp/marimo
    pullPolicy: IfNotPresent

quarto:
  image:
    repository: rg.nl-ams.scw.cloud/REPLACE-PREFIX-srdp/quarto
    pullPolicy: IfNotPresent

# Pull secret for the (private) hub registry — synced from Secret Manager by ESO.
imagePullSecrets:
  - name: srdp-registry

# Data pods run under this SA. Scaleway has no pod OIDC identity, so unlike Azure
# (workload-identity label) the lakehouse S3 credentials are injected as env vars
# from the `srdp-lakehouse` secret (synced by ESO) — see values/<env>.yaml.
serviceAccount:
  create: true
  name: srdp-data
