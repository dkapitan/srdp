# DEV — Scaleway per-env config. Fill {{FROM TERRAFORM}} from `terraform
# -chdir=envs/prod output` (and the hub PN id). Secrets are referenced, never inlined.
global:
  domain: "prod.srdp.example"

# Attach the internal Traefik LB to this env's Private Network.
traefik:
  service:
    annotations:
      service.beta.kubernetes.io/scw-loadbalancer-pn-ids: "{{FROM TERRAFORM prod networking.private_network_id}}"

zitadel:
  zitadel:
    masterkey: "" # from Secret Manager (srdp-zitadel secret), not inline
    configmapConfig:
      ExternalDomain: "auth.prod.srdp.example"
      ExternalPort: 443
      TLS: { Enabled: false }
      Database:
        Postgres:
          Host: "{{FROM TERRAFORM prod postgres_host}}" # RDB private hostname
          Port: 5432
          Database: zitadel
          User: { Username: zitadel, SSL: { Mode: require } }

dagster:
  postgresql:
    postgresqlHost: "{{FROM TERRAFORM prod postgres_host}}"
    postgresqlDatabase: dagster
  dagster-user-deployments:
    deployments:
      - name: srdp-etl
        image: { tag: "v1.0" } # prod runs newest image
        env:
          # DuckLake catalog (Postgres) + Object Storage lakehouse (S3).
          - { name: DUCKLAKE_PG_HOST, value: "{{FROM TERRAFORM prod postgres_host}}" }
          - { name: DUCKLAKE_PG_DB, value: "ducklake" }
          - { name: LAKEHOUSE_S3_URL, value: "s3://acme-prod-lakehouse" } # {{FROM TERRAFORM prod lakehouse_s3_url}}
          - { name: AWS_REGION, value: "nl-ams" }
          - { name: AWS_S3_ENDPOINT, value: "https://s3.nl-ams.scw.cloud" }
          # S3 credentials (IAM key) synced from Secret Manager by ESO.
          - name: AWS_ACCESS_KEY_ID
            valueFrom: { secretKeyRef: { name: srdp-lakehouse, key: access-key } }
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom: { secretKeyRef: { name: srdp-lakehouse, key: secret-key } }
          - name: DUCKLAKE_PG_PASSWORD
            valueFrom: { secretKeyRef: { name: srdp-postgres, key: password } }

marimo:
  image: { tag: "v1.0" }
quarto:
  image: { tag: "v1.0" }

oauth2-proxy:
  extraArgs:
    oidc-issuer-url: "https://auth.prod.srdp.example"
    cookie-domain: ".prod.srdp.example"
    whitelist-domain: ".prod.srdp.example"
    cookie-secure: "true"
