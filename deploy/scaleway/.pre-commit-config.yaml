# Pre-commit hooks. Activate once with:  pre-commit install
# (the git hook wrapper is already present). Hooks pinned to the latest releases
# as of 2026-06-15. Bump with:  pre-commit autoupdate
#
# Tooling needed locally: terraform, tflint. gitleaks is built via Go by
# pre-commit (no system install). terraform_validate is intentionally left to CI
# (it needs provider downloads); pre-commit stays fast.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
