# Everything stage's Flux reconciles (path: deploy/gitops/clusters/scaleway/stage).
# Shared platform pieces come from platform/base; the Scaleway+env-specific
# bindings (secret store, secret mappings) live in this leaf.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/base
  - clustersecretstore.yaml
  - externalsecrets.yaml
