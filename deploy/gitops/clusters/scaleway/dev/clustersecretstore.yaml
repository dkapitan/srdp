# Scaleway Secret Manager store. Authenticates with the IAM key Terraform
# created (eso_app) and seeded into the `scaleway-eso-creds` k8s Secret.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: scaleway-sm
spec:
  provider:
    scaleway:
      region: nl-ams
      projectId: "{{FROM TERRAFORM dev project_id}}"
      accessKey:
        secretRef:
          name: scaleway-eso-creds
          namespace: external-secrets
          key: SCW_ACCESS_KEY
      secretKey:
        secretRef:
          name: scaleway-eso-creds
          namespace: external-secrets
          key: SCW_SECRET_KEY
