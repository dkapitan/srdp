# Sync Secret Manager values into k8s Secrets the chart consumes. Secret Manager
# names are <prefix>-<key> (the secrets module name_prefix is srdp-<env>); refs
# use the `name:` prefix per the ESO Scaleway provider.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: srdp-postgres
  namespace: srdp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: scaleway-sm }
  target: { name: srdp-postgres, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: "name:srdp-prod-postgres-password" }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: srdp-zitadel
  namespace: srdp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: scaleway-sm }
  target: { name: srdp-zitadel, creationPolicy: Owner }
  data:
    - secretKey: masterkey
      remoteRef: { key: "name:srdp-prod-zitadel-masterkey" }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: srdp-oauth2
  namespace: srdp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: scaleway-sm }
  target: { name: srdp-oauth2, creationPolicy: Owner }
  data:
    - secretKey: client-id
      remoteRef: { key: "name:srdp-prod-oauth2-client-id" }
    - secretKey: client-secret
      remoteRef: { key: "name:srdp-prod-oauth2-client-secret" }
    - secretKey: cookie-secret
      remoteRef: { key: "name:srdp-prod-oauth2-cookie-secret" }
---
# Object Storage (S3) credentials for DuckDB/dlt.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: srdp-lakehouse
  namespace: srdp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: scaleway-sm }
  target: { name: srdp-lakehouse, creationPolicy: Owner }
  data:
    - secretKey: access-key
      remoteRef: { key: "name:srdp-prod-lakehouse-access-key" }
    - secretKey: secret-key
      remoteRef: { key: "name:srdp-prod-lakehouse-secret-key" }
---
# Pull secret (dockerconfigjson) for the private hub Container Registry.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: srdp-registry
  namespace: srdp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: scaleway-sm }
  target:
    name: srdp-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"rg.nl-ams.scw.cloud":{"username":"{{ .accessKey }}","password":"{{ .secretKey }}","auth":"{{ printf "%s:%s" .accessKey .secretKey | b64enc }}"}}}
  data:
    - secretKey: accessKey
      remoteRef: { key: "name:srdp-prod-registry-access-key" }
    - secretKey: secretKey
      remoteRef: { key: "name:srdp-prod-registry-secret-key" }
