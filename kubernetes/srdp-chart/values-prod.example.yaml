# Global settings
global:
  domain: "LOAD_BALANCER_IP.nip.io" # CHANGE THIS to the dedicated domain

# Traefik
traefik:
  service:
    spec:
      type: LoadBalancer
      clusterIP: ""

  podSecurityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
  
  # Enable Let's Encrypt ACME
  certResolver: "le"
  additionalArguments:
    - "--certificatesresolvers.le.acme.tlschallenge=true"
    - "--certificatesresolvers.le.acme.email=john@doe.com" # CHANGE THIS
    - "--certificatesresolvers.le.acme.storage=/data/acme.json"

  deployment:
    initContainers:
      - name: fix-acme-perms
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            if [ -f /data/acme.json ]; then
              chmod 600 /data/acme.json
            fi
        volumeMounts:
          - name: data
            mountPath: /data
  
  # Persistence for certificates (so they survive pod restarts)
  persistence:
    enabled: true
    path: /data
    size: 1Gi

# Disable the local Postgres container
zitadel-db:
  enabled: false

# Zitadel auth service
zitadel:
  zitadel:
    masterkey: "ZITADEL_MASTER_KEY" # CHANGE THIS, must be 32 characaters
    secretConfig:
      Database:
        Postgres:
          User:
            Password: "PG_USER_PASS" # CHANGE THIS
          Admin:
            Password: "DB_PASS" # CHANGE  THIS. From Terraform Output
    configmapConfig:
      ExternalDomain: "auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS (must match global.domain)
      ExternalPort: 443
      TLS:
        Enabled: false
      Database:
        Postgres:
          Host: "DB_HOST" # From Terraform Output
          Port: 1234 # DB_PORT - CHANGE THIS. From Terraform Output
          Database: "zitadel-db"
          User:
            Username: "zitadel"
            SSL:
              Mode: require
          Admin:
            Username: "scw_admin"
            SSL:
              Mode: require
      FirstInstance:
        Org:
          Human:
            UserName: zitadel-admin
            Email:
              Address: zitadel-admin@auth.LOAD_BALANCER_IP.nip.io
              Verified: true
            Password: "ZITADEL_ADMIN_FIRST_PASS" # CHANGE THIS
            PasswordChangeRequired: false
    dbSslCaCrtSecret: ""
    dbSslAdminCrtSecret: ""
    dbSslUserCrtSecret: ""

  initJob:
    command: ""
    initContainers:
      - name: wait-for-cloud-db
        image: busybox:1.36
        command: 
          - sh
          - -c
          - |
            HOST="DB_HOST"
            PORT="DB_PORT"
            echo "Waiting for $HOST:$PORT..."
            until nc -z -v -w 5 $HOST $PORT; do sleep 2; done
            echo "Cloud DB is reachable!"

  setupJob:
    initContainers:
      - name: wait-for-cloud-db
        image: busybox:1.36
        command: 
          - sh
          - -c
          - |
            HOST="DB_HOST"
            PORT="DB_PORT"
            echo "Waiting for $HOST:$PORT..."
            until nc -z -v -w 5 $HOST $PORT; do sleep 2; done
            echo "Cloud DB is reachable!"

  # Source: https://github.com/zitadel/zitadel/issues/11163
  login:
    customConfigmapConfig: |
      ZITADEL_SERVICE_USER_TOKEN_FILE="/login-client/pat"
      ZITADEL_API_URL="http://srdp-zitadel:8080"
      CUSTOM_REQUEST_HEADERS="Host:auth.LOAD_BALANCER_IP.nip.io,X-Zitadel-Public-Host:auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS

# O-Auth2 Proxy
oauth2-proxy:
  config:
    clientID: "XXXXXXXXXXXXXXXXXX" # CHANGE THIS
    clientSecret: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" # CHANGE THIS
    # Generate a random string: python3 -c 'import os,base64; print(base64.b64encode(os.urandom(16)).decode())'
    cookieSecret: "OAUTH_COOKIE_SECRET" # Must be 32 characters
  
  extraArgs:
    cookie-domain: ".LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    whitelist-domain: ".LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    oidc-issuer-url: "https://auth.LOAD_BALANCER_IP.nip.io" # CHANGE THIS
    cookie-secure: "false"
  
  customRequestHeaders:
    - "Host:auth.LOAD_BALANCER_IP.nip.io"
  
  # Remove hardcoded local aliases
  hostAliases: []

# Marimo app
marimo:
  enabled: true

# Quarto app
quarto:
  enabled: true
