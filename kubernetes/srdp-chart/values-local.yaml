traefik:
  service:
    type: LoadBalancer
  ports:
    web:
      nodePort: null
    websecure:
      nodePort: null
  tlsStore:
    default:
      defaultCertificate:
        secretName: custom-ingress-cert

zitadel-db:
  auth:
    postgresPassword: "srdpTest123"

zitadel:
  zitadel:
    masterkey: "51a69a373f45c60d2ae08c48bb89d03e" # Must be 32 chars
    secretConfig:
      Database:
        Postgres:
          User:
            Password: srdpTest123
          Admin:
            Password: srdpTest123
  # Source: https://github.com/zitadel/zitadel/issues/11163
  login:
    customConfigmapConfig: |
      ZITADEL_SERVICE_USER_TOKEN_FILE="/login-client/pat"
      ZITADEL_API_URL="http://srdp-zitadel:8080"
      CUSTOM_REQUEST_HEADERS="Host:auth.local.dev,X-Zitadel-Public-Host:auth.local.dev"

oauth2-proxy:
  config:
    clientID: "XXXXXX"
    clientSecret: "XXXXXX"
    cookieSecret: "VcZnfAWYCgMfNjRLvM1byUaAUs2jSvSE"
